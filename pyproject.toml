[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hivemind-reference"
version = "0.1.0"
description = "Local-first governed agent memory and coordination"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "pydantic==2.14.0",
  "httpx==0.28.1", "sqlite-vec==0.1.9", "ladybug==0.21.2",
  "filelock==4.1.0",
]

[project.optional-dependencies]
embedding = ["sentence-transformers[image]==6.1.0", "transformers==5.19.0", "torch==2.14.1",
             "huggingface-hub==1.33.0", "pillow==12.3.0", "torchvision==0.29.1"]
mcp = ["mcp==2.3.0"]
dev = ["pytest==9.1.1", "ruff==0.17.0", "jsonschema[format]"]
runtimes = [
    "droid-sdk>=0.5.0",
]

[project.scripts]
hivemind = "hivemind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hivemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
